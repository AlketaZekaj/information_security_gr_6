server.port=8080
spring.main.banner-mode=off

# Default mode: the only key setting the quick-start needs (Spring Security reference,
# "Specifying a key via Spring Boot"). KEYS_PUB overrides the mounted path for local runs.
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${KEYS_PUB:/keys/public.pem}

# Selects the hardened JwtDecoder bean; validated in Application.main.
study.config-mode=${CONFIG_MODE:default}
